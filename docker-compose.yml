services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run node scripts/setup-env.js first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.js first}
      POSTGRES_DB: ${POSTGRES_DB:?Run node scripts/setup-env.js first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    init: true
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Run node scripts/setup-env.js first}:${POSTGRES_PASSWORD:?Run node scripts/setup-env.js first}@postgres:5432/${POSTGRES_DB:?Run node scripts/setup-env.js first}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Run node scripts/setup-env.js first}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - sh scripts/start-container.sh
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: